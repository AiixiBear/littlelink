# All portal links (quick portals + social profiles).
#
# This is the ONLY file to edit when adding a link. Copy one block,
# change its values, done -- no .astro or .ts files to touch.
# A wrong field or a duplicate id fails the build (schema in
# src/content.config.ts) instead of shipping a broken link.
#
# group: website  -> shown in the Quick portals grid at the top
# group: social   -> shown in the social profiles list at the bottom
#                    (icon required: file in static/images/icons/)
#
# Add a social link:
#
#   - id: my-new-social
#     order: 130
#     group: social
#     href: https://example.com/@me
#     icon: example.svg
#     label: Example · @me
#
# Add a website (quick portal):
#
#   - id: my-new-site
#     order: 130
#     group: website
#     href: https://example.com/
#     label: My new site
#
# label may be a single string (same for every language) or
# per-language, as the website entries below do:
#
#   label:
#     zh-tw: 繁體中文名稱
#     en: English name
#     ja: 日本語の名前
#
# order decides the display order within the group (Astro returns
# collection entries sorted by id, not by file order). Entries use
# steps of 10 so a new link can be inserted between two existing ones;
# appending at the end just needs a number bigger than the last one.
#
# Optional fields:
#   rel:     link rel attribute (default: none; social links usually
#            "noopener", fediverse profiles add "me")
#   copy:    (social only) clicking copies this text instead of
#            opening href -- used for Discord below. Keep href as
#            javascript:void(0); for copy entries.
#   primary: (website only) true = highlighted button style
#   latestArticle: (website only) true = the latest article from
#            www.aiixi.cc is shown under this entry

- id: homepage
  order: 10
  group: website
  href: https://www.aiixi.cc/
